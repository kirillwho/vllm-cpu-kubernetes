# Apply separately AFTER the first successful download.
# Requires a NetworkPolicy-capable CNI, for example Minikube --cni=calico.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offline-proof
  namespace: llm-lab
spec:
  podSelector:
    matchLabels:
      app: llm
  policyTypes: [Egress]
  egress: []
